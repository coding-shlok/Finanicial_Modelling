# Nifty 50 constituents (current as of Sept 2026) with curated sector labels.
# Sector taxonomy: 11 groups roughly following NSE industry classification.
# NOTE: survivorship bias — this is the *current* index membership (see PRD §12).
benchmark: "^NSEI"
risk_free_annual: 0.065

# Corporate actions not handled by yfinance auto_adjust. Prices strictly before
# ex_date are multiplied by open(ex_date)/close(ex_date - 1) so the event does
# not appear as a return.
spinoffs:
  TATAMOTORS: {ex_date: "2025-10-14", note: "Demerger of Tata Motors CV (TMCV); TATAMOTORS renamed TMPV"}

sectors:
  - Banks
  - Financial Services
  - IT
  - Energy
  - FMCG
  - Auto
  - Pharma & Healthcare
  - Metals & Mining
  - Infra & Cement
  - Telecom & Media
  - Consumer

